<rect x="64" y="156" width="560" height="330" rx="16" fill="#FFFFFF" stroke="#DADDE1"/><text x="92" y="200" font-size="22" font-weight="700" fill="#1C1E21">Intended Impact</text><rect x="92" y="228" width="8" height="46" rx="4" fill="#F5533D"/><text x="116" y="248" font-size="17" font-weight="700" fill="#1C1E21">Fewer False Alarms</text><text x="116" y="270" font-size="14" fill="#65676B">Separate fire types to prevent overestimation</text><rect x="92" y="290" width="8" height="46" rx="4" fill="#0866FF"/><text x="116" y="310" font-size="17" font-weight="700" fill="#1C1E21">Proactive Decisions</text><text x="116" y="332" font-size="14" fill="#65676B">See 7-day forecast alongside live heat</text><rect x="92" y="352" width="8" height="46" rx="4" fill="#7B5CFA"/><text x="116" y="372" font-size="17" font-weight="700" fill="#1C1E21">Accessible Analytics</text><text x="116" y="394" font-size="14" fill="#65676B">No GIS expertise needed via EN/JA chat</text><rect x="92" y="414" width="8" height="46" rx="4" fill="#31A24C"/><text x="116" y="434" font-size="17" font-weight="700" fill="#1C1E21">Forest &amp; Peat Monitoring</text><text x="116" y="456" font-size="14" fill="#65676B">Support policy on swidden vs wildfire</text><rect x="656" y="156" width="560" height="330" rx="16" fill="#FFFFFF" stroke="#DADDE1"/><text x="684" y="200" font-size="22" font-weight="700" fill="#1C1E21">Tech Stack</text><rect x="684" y="228" width="86" height="30" rx="15" fill="#F5533D" fill-opacity="0.1"/><text x="727.0" y="248" text-anchor="middle" font-size="13" font-weight="600" fill="#F5533D">Python</text><rect x="782" y="228" width="108" height="30" rx="15" fill="#F5533D" fill-opacity="0.1"/><text x="836.0" y="248" text-anchor="middle" font-size="13" font-weight="600" fill="#F5533D">JavaScript</text><rect x="902" y="228" width="100" height="30" rx="15" fill="#0866FF" fill-opacity="0.1"/><text x="952.0" y="248" text-anchor="middle" font-size="13" font-weight="600" fill="#0866FF">LightGBM</text><rect x="1014" y="228" width="96" height="30" rx="15" fill="#0866FF" fill-opacity="0.1"/><text x="1062.0" y="248" text-anchor="middle" font-size="13" font-weight="600" fill="#0866FF">XGBoost</text><rect x="684" y="274" width="80" height="30" rx="15" fill="#0866FF" fill-opacity="0.1"/><text x="724.0" y="294" text-anchor="middle" font-size="13" font-weight="600" fill="#0866FF">Polars</text><rect x="776" y="274" width="146" height="30" rx="15" fill="#7B5CFA" fill-opacity="0.1"/><text x="849.0" y="294" text-anchor="middle" font-size="13" font-weight="600" fill="#7B5CFA">D3.js / TopoJSON</text><rect x="934" y="274" width="144" height="30" rx="15" fill="#7B5CFA" fill-opacity="0.1"/><text x="1006.0" y="294" text-anchor="middle" font-size="13" font-weight="600" fill="#7B5CFA">Custom 3D Globe</text><rect x="684" y="320" width="108" height="30" rx="15" fill="#7B5CFA" fill-opacity="0.1"/><text x="738.0" y="340" text-anchor="middle" font-size="13" font-weight="600" fill="#7B5CFA">Gemini API</text><rect x="804" y="320" width="82" height="30" rx="15" fill="#31A24C" fill-opacity="0.1"/><text x="845.0" y="340" text-anchor="middle" font-size="13" font-weight="600" fill="#31A24C">Kaggle</text><rect x="898" y="320" width="122" height="30" rx="15" fill="#31A24C" fill-opacity="0.1"/><text x="959.0" y="340" text-anchor="middle" font-size="13" font-weight="600" fill="#31A24C">GitHub Pages</text><text x="684" y="436" font-size="14" fill="#65676B">No dedicated GPU needed · Shared feature code across train &amp; inference</text><rect x="64" y="516" width="1152" height="144" rx="16" fill="#FFFFFF" stroke="#DADDE1"/><rect x="64" y="516" width="1152" height="6" rx="3" fill="#F5533D"/><text x="92" y="560" font-size="20" font-weight="700" fill="#1C1E21">Design Considerations &amp; Limitations</text><circle cx="92" cy="589" r="4" fill="#F5533D"/><text x="108" y="594" font-size="15" fill="#1C1E21">Cross-sensor bias corrected via FRP harmonization</text><circle cx="652" cy="589" r="4" fill="#F5533D"/><tex