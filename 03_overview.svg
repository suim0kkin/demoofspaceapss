<text x="1232" y="39" text-anchor="end" font-size="14" fill="#65676B">03 / 07</text>
<text x="64" y="124" font-size="34" font-weight="700" fill="#1C1E21">プロジェクト概要  —  観測 → 推定 → 解釈</text>
<rect x="64" y="166" width="352" height="300" rx="16" fill="#FFFFFF" stroke="#DADDE1"/><circle cx="108" cy="218" r="22" fill="#F5533D"/><text x="108" y="225" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">1</text><text x="144" y="214" font-size="24" font-weight="700" fill="#1C1E21">Observe</text><text x="144" y="240" font-size="15" fill="#65676B">観測データを集める</text><circle cx="96" cy="296" r="4" fill="#F5533D"/><text x="112" y="301" font-size="16" fill="#1C1E21">FIRMS VIIRS (NOAA-20/21)</text><circle cx="96" cy="348" r="4" fill="#F5533D"/><text x="112" y="353" font-size="16" fill="#1C1E21">MODIS / VIIRS 過去データ</text><circle cx="96" cy="400" r="4" fill="#F5533D"/><text x="112" y="405" font-size="16" fill="#1C1E21">NASA POWER 都市別気象</text><path d="M426 316 h28 m-8 -8 l8 8 l-8 8" fill="none" stroke="#65676B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="464" y="166" width="352" height="300" rx="16" fill="#FFFFFF" stroke="#DADDE1"/><circle cx="508" cy="218" r="22" fill="#0866FF"/><text x="508" y="225" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">2</text><text x="544" y="214" font-size="24" font-weight="700" fill="#1C1E21">Model</text><text x="544" y="240" font-size="15" fill="#65676B">機械学習で推定する</text><circle cx="496" cy="296" r="4" fill="#0866FF"/><text x="512" y="301" font-size="16" fill="#1C1E21">検知: 植生火災 vs 静的熱源</text><circle cx="496" cy="348" r="4" fill="#0866FF"/><text x="512" y="353" font-size="16" fill="#1C1E21">FRP調和: XGBoost Tweedie</text><circle cx="496" cy="400" r="4" fill="#0866FF"/><text x="512" y="405" font-size="16" fill="#1C1E21">7日先リスク (LightGBM)</text><path d="M826 316 h28 m-8 -8 l8 8 l-8 8" fill="none" stroke="#65676B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="864" y="166" width="352" height="300" rx="16" fill="#FFFFFF" stroke="#DADDE1"/><circle cx="908" cy="218" r="22" fill="#7B5CFA"/><text x="908" y="225" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">3</text><text x="944" y="214" font-size="24" font-weight="700" fill="#1C1E21">Explain</text><text x="944" y="240" font-size="15" fill="#65676B">LLMが解釈・操作する</text><circle cx="896" cy="296" r="4" fill="#7B5CFA"/><text x="912" y="301" font-size="16" fill="#1C1E21">Gemini Copilot (BYOK)</text><circle cx="896" cy="348" r="4" fill="#7B5CFA"/><text x="912" y="353" font-size="16" fill="#1C1E21">自然言語で質問 (日/英)</text><circle cx="896" cy="400" r="4" fill="#7B5CFA"/><text x="912" y="405" font-size="16" fill="#1C1E21">地球儀をズーム・強調表示</text><rect x="64" y="500" width="268" height="160" rx="16" fill="#FFFFFF" stroke="#DADDE1"/><text x="88" y="564" font-size="42" font-weight="700" fill="#0866FF">3</text><text x="88" y="601" font-size="17" font-weight="600" fill="#1C1E21">火災の種類を区別</text><text x="88" y="628" font-size="14" fill="#65676B">山火事 / 焼畑 / 産業熱源</text><rect x="356" y="500" width="268" height="160" rx="16" fill="#FFFFFF" stroke="#DADDE1"/><text x="380" y="564" font-size="42" font-weight="700" fill="#0866FF">2</text><text x="380" y="601" font-size="17" font-weight="600" fill="#1C1E21">センサーを統合</text><text x="380" y="628" font-size="14" fill="#65676B">MODIS + VIIRS</text><rect x="648" y="500" width="268" height="160" rx="16" fill="#FFFFFF" stroke="#DADDE1"/><text x="672" y="564" font-size="42" font-weight="700" fill="#0866FF">7日</text><text x="672" y="601" font-size="17" font-weight="600" fill="#1C1E21">先までのリスク</text><text x="672" y="628" font-size="14" fill="#65676B">50km圏の発生確率</text><rect x="940" y="500" width="268" height="160" rx="16" fill="#FFFFFF" stroke="#DADDE1"/><text x="964" y="564" font-size="42" font-weight="700" fill="#0866FF">静的</text><text x="964" y="601" font-size="17" font-weight="600" fill="#1C1E21">サーバー不要配信</text><text x="964" y="628" font-size="14" fill="#65676B">GitHub Pages</text>
