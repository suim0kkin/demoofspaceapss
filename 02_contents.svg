<rect x="64" y="160" width="1152" height="84" rx="16" fill="#FFFFFF" stroke="#DADDE1"/><rect x="64" y="160" width="8" height="84" rx="4" fill="#F5533D"/><text x="108" y="213" font-size="34" font-weight="700" fill="#F5533D">01</text><text x="196" y="199" font-size="23" font-weight="700" fill="#1C1E21">プロジェクト概要</text><text x="196" y="225" font-size="15" fill="#65676B">観測 → ML推定 → LLM解釈の3ステップと基本指標</text><text x="1168" y="212" text-anchor="end" font-size="24" fill="#DADDE1">›</text><rect x="64" y="262" width="1152" height="84" rx="16" fill="#FFFFFF" stroke="#DADDE1"/><rect x="64" y="262" width="8" height="84" rx="4" fill="#7B5CFA"/><text x="108" y="315" font-size="34" font-weight="700" fill="#7B5CFA">02</text><text x="196" y="301" font-size="23" font-weight="700" fill="#1C1E21">LLMによる多角的判断</text><text x="196" y="327" font-size="15" fill="#65676B">5つの視点を統合し、根拠＋地図操作を出力する仕組み</text><text x="1168" y="314" text-anchor="end" font-size="24" fill="#DADDE1">›</text><rect x="64" y="364" width="1152" height="84" rx="16" fill="#FFFFFF" stroke="#DADDE1"/><rect x="64" y="364" width="8" height="84" rx="4" fill="#0866FF"/><text x="108" y="417" font-size="34" font-weight="700" fill="#0866FF">03</text><text x="196" y="403" font-size="23" font-weight="700" fill="#1C1E21">デモ画面：UIと4つの主要機能</text><text x="196" y="429" font-size="15" fill="#65676B">AI Chat・3D地球儀・予測ワークスペース・タイムライン</text><text x="1168" y="416" text-anchor="end" font-size="24" fill="#DADDE1">›</text><rect x="64" y="466" width="1152" height="84" rx="16" fill="#FFFFFF" stroke="#DADDE1"/><rect x="64" y="466" width="8" height="84" rx="4" fill="#0D9AA8"/><text x="108" y="519" font-size="34" font-weight="700" fill="#0D9AA8">04</text><text x="196" y="505" font-size="23" font-weight="700" fill="#1C1E21">デモ画面：LLM連動のリアルタイム分析</text><text x="196" y="531" font-size="15" fill="#65676B">自然言語クエリから地球儀フォーカスと気象ドライバー提示まで</text><text x="1168" y="518" text-anchor="end" font-size="24" fill="#DADDE1">›</text><rect x="64" y="568" width="1152" height="84" rx="16" fill="#FFFFFF" stroke="#DADDE1"/><rect x="64" y="568" width="8" height="84" rx="4" fill="#31A24C"/><text x="108" y="621" font-size="34" font-weight="700" fill="#31A24C">05</text><text x="196" y="607" font-size="23" font-weight="700" fill="#1C1E21">インパクト・技術・設計上の配慮</text><text x="196" y="633" font-size="15" fill="#65676B">期待される効果、使用技術スタック、制約と限界</text><text x="1168" y="620" text-anchor="end" font-size="24" fill="#DADDE1">›</text>
